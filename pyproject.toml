[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "physpy"
version = "0.1.0"
description = "An open-source Python toolkit for computational physics: simulate, visualize, and compute physics concepts across mechanics, electromagnetism, quantum mechanics, and more."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Your Name", email = "you@example.com" }
]
keywords = ["physics", "simulation", "computational-physics", "education", "numpy", "scipy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "black", "ruff"]

[project.urls]
Homepage = "https://github.com/yourusername/physpy"
Repository = "https://github.com/yourusername/physpy"
Issues = "https://github.com/yourusername/physpy/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/physpy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
